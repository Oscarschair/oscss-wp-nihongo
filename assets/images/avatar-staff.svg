<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="staff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="apron-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
  <!-- Body / Shoulder -->
  <path d="M 25 110 C 25 85, 40 75, 60 75 C 80 75, 95 85, 95 110 Z" fill="#ffffff"/>
  <!-- Apron -->
  <path d="M 40 82 L 80 82 L 85 110 L 35 110 Z" fill="url(#apron-grad)"/>
  <!-- Apron Straps -->
  <line x1="45" y1="82" x2="38" y2="72" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="82" x2="82" y2="72" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <!-- Tie / Collar -->
  <polygon points="56,76 64,76 62,86 58,86" fill="#dc2626"/>
  <!-- Neck -->
  <rect x="52" y="62" width="16" height="16" fill="#fcd34d" rx="4"/>
  <!-- Head -->
  <circle cx="60" cy="46" r="24" fill="#fef08a"/>
  <!-- Hair (Back/Sides) -->
  <path d="M 36 46 C 36 28, 46 22, 60 22 C 74 22, 84 28, 84 46 C 84 56, 80 62, 80 62 C 80 62, 76 44, 60 44 C 44 44, 40 62, 40 62 C 40 62, 36 56, 36 46 Z" fill="#78350f"/>
  <!-- Cheeks -->
  <circle cx="46" cy="52" r="4" fill="#f87171" opacity="0.6"/>
  <circle cx="74" cy="52" r="4" fill="#f87171" opacity="0.6"/>
  <!-- Eyes (Smiling Arc) -->
  <path d="M 46 44 Q 50 40 54 44" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 66 44 Q 70 40 74 44" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 54 54 Q 60 60 66 54" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
</svg>
